[metadata]
name = yt2ascii
version = 0.1.0
description = Generate ASCII art GIFs from YouTube videos

[options]
packages = yt2ascii
python_requires = >=3.8
install_requires =
    yt-dlp>=2023.0.0
    opencv-python>=4.5.0
    Pillow>=9.0.0
    numpy>=1.20.0
    click>=8.0.0

[options.entry_points]
console_scripts =
    yt2ascii = yt2ascii.cli:main
